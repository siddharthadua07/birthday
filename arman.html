<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Video</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: #fff4f7;
            background:
                radial-gradient(ellipse at 20% 15%, rgba(255, 119, 180, 0.2), transparent 42%),
                radial-gradient(ellipse at 80% 85%, rgba(147, 112, 219, 0.24), transparent 44%),
                linear-gradient(135deg, #160d25, #391b45 55%, #1a102e);
            font-family: "Segoe UI", Tahoma, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #ffe2f1;
            font-size: clamp(1.8rem, 6vw, 3rem);
            text-shadow: 0 4px 28px rgba(255, 128, 190, 0.35);
        }

        .video-frame {
            width: min(82vw, 420px, 60vh);
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border: 2px solid rgba(255, 226, 242, 0.75);
            border-radius: 24px;
            background: #120b16;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        button {
            padding: 12px 30px;
            border: 1px solid rgba(255, 226, 242, 0.7);
            border-radius: 999px;
            color: #351629;
            background: linear-gradient(135deg, #ffd4e6, #ff9bc8);
            box-shadow: 0 10px 28px rgba(255, 125, 184, 0.28);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        #sound-status {
            margin: -10px 0 0;
            color: #ffd4e2;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <h1>A Special Video</h1>
    <div class="video-frame">
        <video id="special-video" autoplay loop playsinline preload="auto">
            <source src="v3.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <button id="sound-btn" type="button" hidden>Tap to enable sound</button>
    <p id="sound-status" role="status" hidden></p>
    <button id="next-btn" type="button">Next</button>

    <script>
        const specialVideo = document.getElementById("special-video");
        const soundButton = document.getElementById("sound-btn");
        const soundStatus = document.getElementById("sound-status");

        specialVideo.play().catch(function (error) {
            if (error.name === "NotAllowedError") {
                soundButton.hidden = false;
                return;
            }

            soundStatus.textContent = "The video could not be played. Please check that v3.mp4 is available.";
            soundStatus.hidden = false;
            console.error("Video playback failed:", error);
        });

        soundButton.addEventListener("click", function () {
            specialVideo.muted = false;
            specialVideo.play().then(function () {
                soundButton.hidden = true;
                soundStatus.hidden = true;
            }).catch(function (error) {
                soundStatus.textContent = "Sound could not be started. Please try clicking again.";
                soundStatus.hidden = false;
                console.error("Video sound could not be enabled:", error);
            });
        });

        document.getElementById("next-btn").addEventListener("click", function () {
            window.location.href = "reel.html";
        });
    </script>
</body>

</html>
