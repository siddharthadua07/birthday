<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Amazing</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px clamp(14px, 4vw, 48px) 48px;
            color: #fff4f7;
            background:
                radial-gradient(ellipse at 16% 0%, rgba(255, 119, 180, 0.18), transparent 38%),
                linear-gradient(145deg, #160d25, #31183e 52%, #1a102e);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        header {
            max-width: 1100px;
            margin: 0 auto 28px;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #ffe2f1;
            font-size: clamp(2rem, 6vw, 3.2rem);
            text-shadow: 0 4px 28px rgba(255, 128, 190, 0.35);
        }

        #gallery-status {
            margin: 12px 0 0;
            color: #ffd6e8;
            overflow-wrap: anywhere;
        }

        #gallery-status:empty {
            display: none;
        }

        .gallery {
            columns: 2;
            column-gap: 16px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .gallery-card {
            position: relative;
            display: block;
            width: 100%;
            margin: 0 0 16px;
            overflow: hidden;
            break-inside: avoid;
            border: 1px solid rgba(255, 226, 242, 0.22);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.25);
        }

        .gallery-card img {
            display: block;
            width: 100%;
            height: auto;
        }

        .image-placeholder {
            min-height: var(--tile-height, 260px);
            display: grid;
            place-content: center;
            gap: 10px;
            padding: 18px;
            color: #ffe2f1;
            background:
                radial-gradient(circle at 30% 25%, rgba(255, 153, 199, 0.2), transparent 46%),
                linear-gradient(145deg, #291633, #432344);
            text-align: center;
        }

        .image-placeholder[hidden] {
            display: none;
        }

        .image-placeholder strong {
            font-size: 1.1rem;
            overflow-wrap: anywhere;
        }

        .image-placeholder span {
            color: rgba(255, 244, 248, 0.75);
            font-size: 0.88rem;
        }

        .gallery-next {
            display: block;
            margin: 36px auto 0;
            padding: 12px 34px;
            border: 1px solid rgba(255, 226, 242, 0.7);
            border-radius: 999px;
            color: #351629;
            background: linear-gradient(135deg, #ffd4e6, #ff9bc8);
            box-shadow: 0 10px 28px rgba(255, 125, 184, 0.28);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .gallery-next:hover {
            filter: brightness(1.08);
        }

        .gallery-next:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        @media (min-width: 560px) {
            .gallery {
                columns: 3;
                column-gap: 18px;
            }

            .gallery-card {
                margin-bottom: 18px;
                border-radius: 20px;
            }
        }

        @media (min-width: 900px) {
            .gallery {
                columns: 4;
            }
        }

    </style>
</head>

<body>
    <audio autoplay loop preload="auto" aria-hidden="true">
        <source src="f9.mp3" type="audio/mpeg">
    </audio>
    <header>
        <h1>Something Amazing</h1>
        <p id="gallery-status" role="status" aria-live="polite"></p>
    </header>
    <main id="gallery" class="gallery" aria-label="Photo gallery"></main>
    <button id="gallery-next" class="gallery-next" type="button">Next</button>

    <script>
        const gallery = document.getElementById("gallery");
        const galleryStatus = document.getElementById("gallery-status");
        const missingImages = [];

        for (let imageNumber = 1; imageNumber <= 30; imageNumber++) {
            const imageName = `m${imageNumber}.png`;
            const card = document.createElement("figure");
            card.className = "gallery-card";

            const image = document.createElement("img");
            image.src = imageName;
            image.alt = `Gallery photo ${imageNumber}`;
            image.loading = imageNumber > 8 ? "lazy" : "eager";

            const placeholder = document.createElement("div");
            placeholder.className = "image-placeholder";
            placeholder.hidden = true;
            placeholder.innerHTML = `<strong>${imageName} not found</strong><span>Add it to the same folder as gg.html.</span>`;

            image.addEventListener("error", function () {
                image.hidden = true;
                placeholder.hidden = false;
                missingImages.push(imageName);
                galleryStatus.textContent = `Gallery images not found: ${missingImages.join(", ")}`;
            });

            card.append(image, placeholder);
            gallery.appendChild(card);
        }

        document.getElementById("gallery-next").addEventListener("click", function () {
            window.location.href = "ques.html";
        });
    </script>
</body>

</html>
