<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One More Birthday Surprise</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            color: #fff4f7;
            background: linear-gradient(135deg, #24102b, #63294d, #27122e);
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }

        h1 {
            margin: 0;
            color: #ffd4e2;
            font-size: clamp(1.8rem, 6vw, 3.4rem);
            text-shadow: 0 4px 24px rgba(255, 130, 180, 0.35);
        }

        .video-frame {
            width: min(90vw, 405px, 39.375vh);
            aspect-ratio: 9 / 16;
            overflow: hidden;
            border: 3px solid rgba(255, 212, 226, 0.75);
            border-radius: 18px;
            background: #120b16;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #sound-btn,
        #next-btn {
            padding: 12px 30px;
            border: 1px solid #ffe0eb;
            border-radius: 999px;
            color: #351629;
            background: #ffd4e2;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        #sound-status,
        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <h1>Happy Birthday Sumana</h1>
    <div class="video-frame">
        <video id="birthday-video" autoplay loop playsinline preload="auto">
            <source src="v2.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    <button id="sound-btn" type="button" hidden>Tap to enable sound</button>
    <p id="sound-status" role="status" hidden></p>
    <button id="next-btn" type="button">Next</button>
    <script>
        const birthdayVideo = document.getElementById("birthday-video");
        const soundButton = document.getElementById("sound-btn");
        const soundStatus = document.getElementById("sound-status");

        birthdayVideo.play().catch(function (error) {
            if (error.name === "NotAllowedError") {
                soundButton.hidden = false;
                return;
            }

            soundStatus.textContent = "The video could not be played. Please reload the page and try again.";
            soundStatus.hidden = false;
            console.error("Video playback failed:", error);
        });

        soundButton.addEventListener("click", function () {
            birthdayVideo.muted = false;
            birthdayVideo.play().then(function () {
                soundButton.hidden = true;
                soundStatus.hidden = true;
            }).catch(function (error) {
                soundStatus.textContent = "Sound could not be started. Please try clicking again.";
                soundStatus.hidden = false;
                console.error("Video sound could not be enabled:", error);
            });
        });

        document.getElementById("next-btn").addEventListener("click", function () {
            window.location.href = "birth.html";
        });
    </script>
</body>

</html>
