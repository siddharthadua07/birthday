<!doctype html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aap Kase Lagte Ho Mujhe?</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff5fa;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(255, 119, 180, 0.2), transparent 42%),
                radial-gradient(ellipse at 80% 80%, rgba(147, 112, 219, 0.25), transparent 44%),
                linear-gradient(135deg, #160d25, #391b45 55%, #1a102e);
            font-family: "Segoe UI", Tahoma, sans-serif;
            text-align: center;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(32px, 8vw, 64px) clamp(24px, 6vw, 52px);
            border: 1px solid rgba(255, 226, 242, 0.3);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 32px;
            color: #ffe2f1;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.25;
            text-shadow: 0 4px 28px rgba(255, 128, 190, 0.35);
        }

        button {
            padding: 14px 32px;
            border: 0;
            border-radius: 999px;
            color: #351629;
            background: linear-gradient(135deg, #ffd4e6, #ff9bc8);
            box-shadow: 0 10px 28px rgba(255, 125, 184, 0.28);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 34px rgba(255, 125, 184, 0.4);
        }

        button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Aap kase lagte ho mujhe?</h1>
        <button id="know-btn" type="button">Please jaan lo</button>
    </main>
    <script>
        document.getElementById("know-btn").addEventListener("click", function () {
            window.location.href = "asei.html";
        });
    </script>
</body>

</html>
