<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Details</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 18px 48px;
            color: #fff4f7;
            background:
                radial-gradient(ellipse at 18% 12%, rgba(255, 119, 180, 0.18), transparent 40%),
                linear-gradient(145deg, #160d25, #31183e 52%, #1a102e);
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        main {
            width: min(100%, 820px);
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 24px;
            color: #ffe2f1;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            text-align: center;
            text-shadow: 0 4px 28px rgba(255, 128, 190, 0.35);
        }

        .gift-images {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }

        .product-image-frame {
            position: relative;
            min-width: 0;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border: 1px solid rgba(255, 226, 242, 0.28);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.25);
        }

        .product-image-frame img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-image-placeholder {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            padding: 12px;
            color: #ffe2f1;
            background: linear-gradient(145deg, #291633, #432344);
            text-align: center;
            overflow-wrap: anywhere;
        }

        .product-image-placeholder[hidden] {
            display: none;
        }

        form {
            display: grid;
            gap: 18px;
            padding: clamp(20px, 5vw, 32px);
            border: 1px solid rgba(255, 226, 242, 0.25);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
        }

        form[hidden] {
            display: none;
        }

        h2 {
            margin: 0;
            color: #ffe2f1;
            font-size: 1.35rem;
        }

        label {
            display: grid;
            gap: 7px;
            color: #ffe2f1;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255, 226, 242, 0.35);
            border-radius: 12px;
            color: #fff4f7;
            background: rgba(17, 10, 28, 0.58);
            font: inherit;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(255, 244, 248, 0.62);
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #ff9bc8;
            outline-offset: 2px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .address-note,
        .privacy-note {
            margin: 0;
            color: rgba(255, 244, 248, 0.82);
            line-height: 1.6;
        }

        .address-note {
            padding: 14px 16px;
            border: 1px solid rgba(255, 193, 120, 0.42);
            border-radius: 14px;
            color: #ffe2b8;
            background: rgba(255, 177, 92, 0.1);
            font-size: 1rem;
            font-weight: 600;
        }

        .privacy-note {
            font-size: 0.9rem;
        }

        .chocolate-option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 226, 242, 0.32);
            border-radius: 16px;
            color: #ffe2f1;
            background: rgba(255, 255, 255, 0.07);
            font-size: clamp(1.2rem, 4vw, 1.55rem);
            font-weight: 700;
            line-height: 1.35;
            cursor: pointer;
        }

        .chocolate-option input {
            width: 24px;
            height: 24px;
            flex: 0 0 auto;
            margin: 0;
            accent-color: #ff9bc8;
            cursor: pointer;
        }

        button {
            justify-self: start;
            padding: 12px 28px;
            border: 1px solid rgba(255, 226, 242, 0.7);
            border-radius: 999px;
            color: #351629;
            background: linear-gradient(135deg, #ffd4e6, #ff9bc8);
            box-shadow: 0 10px 28px rgba(255, 125, 184, 0.28);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        #form-status {
            margin: 0;
            color: #ffd6e8;
            line-height: 1.5;
        }

        #form-status:empty {
            display: none;
        }

        .back-link {
            display: inline-block;
            margin: 20px 0 0;
            color: #ffe2f1;
        }

        .success-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        .ending-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 226, 242, 0.7);
            border-radius: 999px;
            color: #351629;
            background: linear-gradient(135deg, #ffd4e6, #ff9bc8);
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .gift-images {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1 id="gift-title">Gift details</h1>
        <div id="gift-images" class="gift-images" aria-label="Gift pictures"></div>
        <form id="delivery-form">
            <h2>Please enter your delivery location</h2>
            <label>
                Name
                <input name="name" autocomplete="name" placeholder="Enter your name" required>
            </label>
            <label>
                Phone
                <input name="phone" type="tel" autocomplete="tel" placeholder="Enter your phone number" required>
            </label>
            <label>
                Flat/house/building name
                <input name="building" autocomplete="address-line1" placeholder="Siv Mandir" required>
            </label>
            <label>
                Area/House/Locality
                <textarea name="locality" autocomplete="street-address" placeholder="Park Circus, Rifle Range Road, Ballygunge, Kolkata, West Bengal, 700017" required></textarea>
            </label>
            <p class="address-note">
                Please enter correct, complete delivery details like on Flipkart. Incorrect details may prevent delivery.
            </p>
            <p class="privacy-note">
                Your details will be emailed for order review. Delivery will be confirmed separately.
            </p>
            <button id="submit-order" type="submit">Submit details</button>
            <label class="chocolate-option">
                <input name="want-chocolate" type="checkbox" value="yes">
                <span>Would you like chocolate?</span>
            </label>
            <p id="form-status" role="status" aria-live="polite"></p>
        </form>
        <div class="success-actions">
            <a class="back-link" href="gif.html">Back to gifts</a>
            <a id="ending-link" class="ending-link" href="eng.html" hidden>Ending &gt;&gt;</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        const giftImages = document.getElementById("gift-images");
        const giftTitle = document.getElementById("gift-title");
        const giftNumber = Number(new URLSearchParams(window.location.search).get("gift"));
        const deliveryForm = document.getElementById("delivery-form");
        const submitButton = document.getElementById("submit-order");
        const formStatus = document.getElementById("form-status");
        const endingLink = document.getElementById("ending-link");
        const emailJsPublicKey = "NKEN9Jywswc3HoohY";
        let emailJsInitialized = false;

        if (!Number.isInteger(giftNumber) || giftNumber < 1 || giftNumber > 14) {
            giftTitle.textContent = "Gift not found";
            const message = document.createElement("p");
            message.textContent = "Choose a gift from the gallery to see its details.";
            giftImages.appendChild(message);
            document.getElementById("delivery-form").hidden = true;
        } else {
            giftTitle.textContent = `Gift ${giftNumber}`;

            for (const fileName of [`gi${giftNumber}.png`, `gi${giftNumber}.1.png`]) {
                const frame = document.createElement("div");
                frame.className = "product-image-frame";

                const image = document.createElement("img");
                image.src = fileName;
                image.alt = `Gift ${giftNumber}`;

                if (fileName === `gi${giftNumber}.1.png`) {
                    image.dataset.alternateSource = `gi${giftNumber}.1png`;
                }

                const placeholder = document.createElement("div");
                placeholder.className = "product-image-placeholder";
                placeholder.hidden = true;
                placeholder.textContent = `${fileName} not found`;

                image.addEventListener("error", function () {
                    const alternateSource = image.dataset.alternateSource;
                    if (alternateSource) {
                        delete image.dataset.alternateSource;
                        image.src = alternateSource;
                        return;
                    }

                    image.hidden = true;
                    placeholder.hidden = false;
                });

                frame.append(image, placeholder);
                giftImages.appendChild(frame);
            }
        }

        deliveryForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (submitButton.disabled) {
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Placing Order...";
            formStatus.textContent = "";

            try {
                if (!window.emailjs) {
                    throw new Error("EmailJS SDK is unavailable.");
                }

                if (!emailJsInitialized) {
                    window.emailjs.init({ publicKey: emailJsPublicKey });
                    emailJsInitialized = true;
                }

                const formData = new FormData(deliveryForm);
                await window.emailjs.send("service_z842jek", "template_hb60x9w", {
                    giftNumber: giftNumber,
                    name: formData.get("name"),
                    phone: formData.get("phone"),
                    building: formData.get("building"),
                    locality: formData.get("locality"),
                    chocolate: formData.has("want-chocolate") ? "Yes" : "No"
                });

                deliveryForm.reset();
                formStatus.textContent = "Your order has been successfully placed!";
                endingLink.hidden = false;
            } catch (error) {
                console.error("EmailJS order submission failed:", error);
                formStatus.textContent = "Something went wrong. Please try again.";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Submit details";
            }
        });
    </script>
</body>

</html>
