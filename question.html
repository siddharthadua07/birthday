<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Are You Ready?</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff4f8;
            background:
                radial-gradient(ellipse at 18% 18%, rgba(255, 115, 173, 0.2), transparent 42%),
                radial-gradient(ellipse at 82% 82%, rgba(154, 121, 255, 0.23), transparent 44%),
                linear-gradient(135deg, #160d25, #391b45 55%, #1a102e);
            font-family: "Segoe UI", Tahoma, sans-serif;
            text-align: center;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(32px, 8vw, 64px) clamp(24px, 6vw, 52px);
            border: 1px solid rgba(255, 226, 242, 0.3);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0 0 36px;
            color: #ffe2f1;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.25;
            text-shadow: 0 4px 28px rgba(255, 128, 190, 0.35);
        }

        .button-area {
            position: relative;
            width: min(100%, 350px);
            height: 72px;
            margin: 0 auto;
        }

        .choice-btn {
            min-width: 128px;
            padding: 13px 26px;
            border: 1px solid rgba(255, 226, 242, 0.7);
            border-radius: 999px;
            color: #351629;
            background: linear-gradient(135deg, #ffd4e6, #ff9bc8);
            box-shadow: 0 10px 28px rgba(255, 125, 184, 0.28);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        #yes-btn {
            position: absolute;
            top: 8px;
            left: 10px;
        }

        #no-btn {
            position: fixed;
            top: 60vh;
            left: 70vw;
            right: auto;
            z-index: 1000;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
            transition: left 0.16s ease, top 0.16s ease;
        }

        .choice-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            #no-btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Are you ready to see something amazing?</h1>
        <div class="button-area" id="button-area">
            <button class="choice-btn" id="yes-btn" type="button">Yes</button>
        </div>
    </main>
    <button class="choice-btn" id="no-btn" type="button">No</button>
    <script>
        const buttonArea = document.getElementById("button-area");
        const noButton = document.getElementById("no-btn");

        function moveNoButton() {
            const buttonBounds = noButton.getBoundingClientRect();
            const edgePadding = 12;
            const maxLeft = Math.max(edgePadding, window.innerWidth - buttonBounds.width - edgePadding);
            const maxTop = Math.max(edgePadding, window.innerHeight - buttonBounds.height - edgePadding);
            const currentBounds = noButton.getBoundingClientRect();
            const currentLeft = currentBounds.left;
            const currentTop = currentBounds.top;
            let left = currentLeft;
            let top = currentTop;

            for (let attempt = 0; attempt < 8 && left === currentLeft && top === currentTop; attempt++) {
                left = edgePadding + Math.round(Math.random() * (maxLeft - edgePadding));
                top = edgePadding + Math.round(Math.random() * (maxTop - edgePadding));
            }

            noButton.style.left = `${left}px`;
            noButton.style.top = `${top}px`;
        }

        noButton.addEventListener("pointerenter", moveNoButton);
        noButton.addEventListener("pointerdown", function (event) {
            event.preventDefault();
            moveNoButton();
        });
        noButton.addEventListener("focus", moveNoButton);
        noButton.addEventListener("click", function (event) {
            event.preventDefault();
            moveNoButton();
        });

        document.getElementById("yes-btn").addEventListener("click", function () {
            window.location.href = "gg.html";
        });
    </script>
</body>

</html>
